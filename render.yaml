services:
  # 1. API Web Service
  - type: web
    name: proofscale-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start --workspace=apps/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # You will paste your DB URL in the dashboard
      # Phase 3 durable scheduler (runs inside this API process):
      # Set to "false" to stop claiming scheduled occurrences (incident brake).
      - key: SCHEDULER_ENABLED
        value: "true"
      # Tick cadence; <=10 occurrence claims per tick.
      - key: SCHEDULER_INTERVAL_MS
        value: "30000"

  # 2. Execution Background Worker
  - type: worker
    name: proofscale-worker
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start --workspace=apps/worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Same DB URL as above